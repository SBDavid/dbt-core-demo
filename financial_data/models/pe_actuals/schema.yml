version: 2

models:
  - name: stg_eps_actuals
    description: "Cleans raw S&P 500 EPS actuals seed data: casts year, quarter, and EPS fields to proper types."
    columns:
      - name: date_year
        description: "Calendar year of the quarterly EPS reading."
        data_tests:
          - not_null
      - name: date_quarter
        description: "Fiscal quarter (1 = Q1, 2 = Q2, 3 = Q3, 4 = Q4)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
      - name: eps_actuals
        description: "S&P 500 trailing twelve-month EPS actuals."
        data_tests:
          - not_null

  - name: stg_sp_500_price
    description: >
      Cleans raw S&P 500 index price seed data: parses MM/DD/YYYY dates and casts
      comma-formatted Price, Open, High, and Low fields to numeric.
    columns:
      - name: report_date
        description: "Daily trading date."
        data_tests:
          - not_null
          - unique
      - name: price
        description: "S&P 500 index closing price."
        data_tests:
          - not_null
      - name: open
        description: "S&P 500 index opening price."
        data_tests:
          - not_null
      - name: high
        description: "S&P 500 index intraday high."
        data_tests:
          - not_null
      - name: low
        description: "S&P 500 index intraday low."
        data_tests:
          - not_null

  - name: fct_eps_actuals_ttm
    description: >
      S&P 500 EPS fact table with rolling four-quarter (twelve-month) TTM computed
      from quarterly eps_actuals readings.
    columns:
      - name: date_year
        description: "Calendar year of the quarterly EPS reading."
        data_tests:
          - not_null
      - name: date_quarter
        description: "Fiscal quarter (1 = Q1, 2 = Q2, 3 = Q3, 4 = Q4)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
      - name: eps_actuals
        description: "Quarterly S&P 500 EPS actuals for the reporting period."
        data_tests:
          - not_null
      - name: eps_actuals_ttm
        description: >
          Rolling four-quarter TTM EPS. Sum of eps_actuals over the current row
          and the prior three quarters, ordered by date_year and date_quarter.
        data_tests:
          - not_null

  - name: biz_pe_actual
    description: >
      Daily S&P 500 PE ratio (price / eps_actuals_ttm) for the last 5 years of
      trading days. EPS is matched to the calendar quarter of each price date;
      when the quarter has no EPS yet, the most recent prior quarter TTM is used
      (forward fill / last value).
    columns:
      - name: report_date
        description: "Daily trading date."
        data_tests:
          - not_null
          - unique
      - name: price
        description: "S&P 500 index closing price."
        data_tests:
          - not_null
      - name: eps_date_year
        description: "Calendar year of the EPS quarter used for this row."
      - name: eps_date_quarter
        description: "Calendar quarter (1–4) of the EPS reading used for this row."
      - name: eps_actuals_ttm
        description: "TTM EPS applied to this trading day (exact quarter or forward-filled)."
      - name: pe_actual
        description: "Price-to-earnings ratio: price / eps_actuals_ttm."
        data_tests:
          - not_null

  - name: biz_pe_actual_percentile_5y
    description: >
      Latest 10 daily S&P 500 PE readings, each annotated with its rolling
      percent_rank within the 5 years prior to that row's report_date. Useful
      for gauging how extreme the current PE is relative to recent history.
    columns:
      - name: report_date
        description: "Daily trading date."
        data_tests:
          - not_null
          - unique
      - name: price
        description: "S&P 500 index closing price."
        data_tests:
          - not_null
      - name: pe_actual
        description: "Price-to-earnings ratio: price / eps_actuals_ttm."
        data_tests:
          - not_null
      - name: pe_actual_percentile_5y
        description: >
          Rolling percent_rank (0–1) of pe_actual within the 5-year window
          ending on report_date. Computed as:
          count(rows with pe_actual < current) / (total rows in window - 1).
          A value of 1.0 means the highest PE in the past 5 years;
          0.0 means the lowest.
        data_tests:
          - not_null
